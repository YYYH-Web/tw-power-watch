name: 全部更新
# 網站「手動更新」按鈕呼叫的工作流程：一次跑完所有抓取程式，避免多個工作流程排隊互相取消。
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tests/test_parsers.py
      - run: cd fetchers && python fetch_all.py
      - run: cd fetchers && python realtime.py
      - run: cd fetchers && python news.py
      - name: Commit data
        run: |
          git config user.name "power-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "data: 手動全部更新 $(date -u +%FT%H:%M)"
          git pull --rebase
          git push
