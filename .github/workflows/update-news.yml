name: 更新新聞
on:
  schedule:
    - cron: "0 22 * * *"     # 每天 06:00（台灣時間）
    - cron: "0 9 * * *"      # 每天 17:00（台灣時間）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: cd fetchers && python news.py
      - name: Commit data
        run: |
          git config user.name "power-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "data: 新聞更新 $(date -u +%F)"
          git pull --rebase
          git push
