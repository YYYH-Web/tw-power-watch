name: 即時發電取樣
on:
  schedule:
    - cron: "17 * * * *"     # 每小時取樣一次，用於估算月發電量與容量因數
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: cd fetchers && python realtime.py
      - name: Commit data
        run: |
          git config user.name "power-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "data: 即時取樣 $(date -u +%FT%H:%M)"
          git pull --rebase
          git push
