name: 全部更新
# 網站「手動更新」按鈕呼叫的工作流程：一次跑完所有抓取程式，避免多個工作流程排隊互相取消。
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  all:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tests/test_parsers.py
      - run: cd fetchers && python fetch_all.py
        continue-on-error: true
      - run: cd fetchers && python realtime.py
        continue-on-error: true
      - run: cd fetchers && python news.py
        continue-on-error: true
      - name: Commit data
        if: always()
        run: |
          git config user.name "power-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "data: 手動全部更新 $(date -u +%FT%H:%M)"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
