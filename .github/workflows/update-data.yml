name: 更新電力資料
on:
  schedule:
    - cron: "0 1 5,15 * *"   # 每月 5 日、15 日 09:00（台灣時間）
  workflow_dispatch:
  push:                      # 從網站上傳月報 PDF 後自動解析
    branches: [main]
    paths: ["reports/**", "fetchers/monthly_reports.txt"]
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tests/test_parsers.py
      - run: cd fetchers && python fetch_all.py
        continue-on-error: true
      - name: Commit data
        if: always()
        run: |
          git config user.name "power-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "data: 月度資料更新 $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
