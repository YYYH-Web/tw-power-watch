<!doctype html>
<html lang="zh-Hant-TW" data-repo="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>再生能源｜台灣電力觀測站</title>
<meta name="description" content="台灣太陽光電、離岸與陸域風電、水力、生質能裝置容量與容量因數。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b57a4'/%3E%3Cpath d='M18 4 8 18h7l-2 10 11-15h-7z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@700&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.1/echarts.min.js" defer></script>
</head>
<body>
<main class="wrap" id="main">
<div class="page-head"><h1>再生能源</h1><p>太陽光電、風電、水力與生質能的建置進度，以及各類機組的容量因數。</p></div>
<div class="row row--2" id="facts"></div>
<section class="panel">
  <div class="panel__head"><div><h2>再生能源裝置容量</h2><p class="sub">近 11 年，依類別堆疊</p></div><div class="seg" id="scope" role="group" aria-label="統計口徑"></div></div>
  <div id="c-recap" class="chart chart--tall"></div><div id="s-recap"></div>
</section>
<div class="row row--2">
  <section class="panel"><h2>離岸與陸域風電</h2><p class="sub">裝置容量</p><div id="c-wind" class="chart"></div><div id="s-wind"></div></section>
  <section class="panel"><h2>各類機組容量因數<span class="tag-est">估算</span></h2><p class="sub" id="cf-month">最近一個完整月份</p><div id="c-cf" class="chart"></div></section>
</div>
<section class="panel"><h2>容量因數月變化<span class="tag-est">估算</span></h2><p class="sub">太陽光電、風電與燃煤、燃氣比較</p><div id="c-cf-trend" class="chart"></div><div id="s-cf"></div></section>
</main>
<script type="module" src="assets/js/pages/renewables.js"></script>
</body>
</html>
